<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Fluid Dynamics v2.0</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background-color: #020205; }
        canvas { display: block; width: 100vw; height: 100vh; }
    </style>
</head>
<body>
    <canvas id="fluidCanvas"></canvas>
    <script>
        const canvas = document.getElementById('fluidCanvas');
        const ctx = canvas.getContext('2d');
        const N = 64, ITER = 16, size = (N + 2) * (N + 2);

        const offscreenCanvas = document.createElement('canvas');
        offscreenCanvas.width = N + 2; offscreenCanvas.height = N + 2;
        const offscreenCtx = offscreenCanvas.getContext('2d');
        const imageData = offscreenCtx.createImageData(N + 2, N + 2);

        let Vx = new Float32Array(size), Vy = new Float32Array(size);
        let Vx0 = new Float32Array(size), Vy0 = new Float32Array(size);
        let s = new Float32Array(size), density = new Float32Array(size);
        let mouseX = 0, mouseY = 0, isFirstMove = true;

        function IX(x, y) { return Math.max(0, Math.min(x, N + 1)) + Math.max(0, Math.min(y, N + 1)) * (N + 2); }

        function set_bnd(b, x) {
            for (let i = 1; i <= N; i++) {
                x[IX(i, 0)]     = b === 2 ? -x[IX(i, 1)]     : x[IX(i, 1)];
                x[IX(i, N + 1)] = b === 2 ? -x[IX(i, N)]     : x[IX(i, N)];
                x[IX(0, i)]     = b === 1 ? -x[IX(1, i)]     : x[IX(1, i)];
                x[IX(N + 1, i)] = b === 1 ? -x[IX(N, i)]     : x[IX(N, i)];
            }
        }

        function lin_solve(b, x, x0, a, c) {
            const cR = 1.0 / c;
            for (let k = 0; k < ITER; k++) {
                for (let j = 1; j <= N; j++) {
                    for (let i = 1; i <= N; i++) {
                        x[IX(i, j)] = (x0[IX(i, j)] + a * (x[IX(i+1, j)] + x[IX(i-1, j)] + x[IX(i, j+1)] + x[IX(i, j-1)])) * cR;
                    }
                }
                set_bnd(b, x);
            }
        }

        function diffuse(b, x, x0, diff, dt) { let a = dt * diff * N * N; lin_solve(b, x, x0, a, 1 + 4 * a); }

        function project(velocX, velocY, p, div) {
            for (let j = 1; j <= N; j++) {
                for (let i = 1; i <= N; i++) {
                    div[IX(i, j)] = -0.5 * (velocX[IX(i+1, j)] - velocX[IX(i-1, j)] + velocY[IX(i, j+1)] - velocY[IX(i, j-1)]) / N;
                    p[IX(i, j)] = 0;
                }
            }
            set_bnd(0, div); set_bnd(0, p); lin_solve(0, p, div, 1, 4);
            for (let j = 1; j <= N; j++) {
                for (let i = 1; i <= N; i++) {
                    velocX[IX(i, j)] -= 0.5 * N * (p[IX(i+1, j)] - p[IX(i-1, j)]);
                    velocY[IX(i, j)] -= 0.5 * N * (p[IX(i, j+1)] - p[IX(i, j-1)]);
                }
            }
            set_bnd(1, velocX); set_bnd(2, velocY);
        }

        function advect(b, d, d0, velocX, velocY, dt) {
            let dtx = dt * N, dty = dt * N;
            for (let j = 1; j <= N; j++) {
                for (let i = 1; i <= N; i++) {
                    let x = i - dtx * velocX[IX(i, j)], y = j - dty * velocY[IX(i, j)];
                    if (x < 0.5) x = 0.5; if (x > N + 0.5) x = N + 0.5;
                    let i0 = Math.floor(x), i1 = i0 + 1;
                    if (y < 0.5) y = 0.5; if (y > N + 0.5) y = N + 0.5;
                    let j0 = Math.floor(y), j1 = j0 + 1;
                    let s1 = x - i0, s0 = 1 - s1, t1 = y - j0, t0 = 1 - t1;
                    d[IX(i, j)] = s0 * (t0 * d0[IX(i0, j0)] + t1 * d0[IX(i0, j1)]) + s1 * (t0 * d0[IX(i1, j0)] + t1 * d0[IX(i1, j1)]);
                }
            }
            set_bnd(b, d);
        }

        function step(dt) {
            diffuse(1, Vx0, Vx, 0.0001, dt); diffuse(2, Vy0, Vy, 0.0001, dt);
            project(Vx0, Vy0, Vx, Vy); advect(1, Vx, Vx0, Vx0, Vy0, dt); advect(2, Vy, Vy0, Vx0, Vy0, dt); project(Vx, Vy, Vx0, Vy0);
            diffuse(0, s, density, 0.0001, dt); advect(0, density, s, Vx, Vy, dt);
            for (let i = 0; i < size; i++) { density[i] *= 0.985; Vx[i] *= 0.99; Vy[i] *= 0.99; }
        }

        window.addEventListener('mousemove', (e) => {
            if (isFirstMove) { mouseX = e.clientX; mouseY = e.clientY; isFirstMove = false; return; }
            let fX = (e.clientX - mouseX) * 0.15, fY = (e.clientY - mouseY) * 0.15;
            fX = Math.max(-4.5, Math.min(4.5, fX)); fY = Math.max(-4.5, Math.min(4.5, fY));
            mouseX = e.clientX; mouseY = e.clientY;
            const cX = Math.floor((mouseX / window.innerWidth) * N) + 1;
            const cY = Math.floor((mouseY / window.innerHeight) * N) + 1;
            if (cX > 0 && cX <= N && cY > 0 && cY <= N) { const idx = IX(cX, cY); density[idx] += 8.0; Vx[idx] += fX; Vy[idx] += fY; }
        });

        function fit() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', fit); fit();

        function draw() {
            step(0.1);
            const data = imageData.data;
            for (let y = 0; y < N + 2; y++) {
                for (let x = 0; x < N + 2; x++) {
                    const d = density[IX(x, y)], idx = (x + y * (N + 2)) * 4;
                    data[idx] = Math.floor(Math.min(255, d * 45)); data[idx+1] = Math.floor(Math.min(255, d * 12)); data[idx+2] = Math.floor(Math.min(255, d * 220)); data[idx+3] = 255;
                }
            }
            offscreenCtx.putImageData(imageData, 0, 0);
            ctx.fillStyle = '#020205'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(offscreenCanvas, 0, 0, canvas.width, canvas.height);
            requestAnimationFrame(draw);
        }
        draw();
    </script>
</body>
</html>
