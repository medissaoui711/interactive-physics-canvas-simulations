<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Living Neural Network Topology</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background: #020205; }
        canvas { display: block; }
    </style>
</head>
<body>
    <canvas id="netCanvas"></canvas>
    <script>
        const canvas = document.getElementById('netCanvas');
        const ctx = canvas.getContext('2d');
        let w = canvas.width = window.innerWidth, h = canvas.height = window.innerHeight;

        const nodes = [];
        for (let i = 0; i < 120; i++) {
            nodes.push({
                x: Math.random() * w, y: Math.random() * h,
                vx: Math.random() * 1.6 - 0.8, vy: Math.random() * 1.6 - 0.8,
                pulse: Math.random() * Math.PI
            });
        }

        window.addEventListener('resize', () => { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; });

        function draw() {
            ctx.fillStyle = '#020205'; ctx.fillRect(0, 0, w, h);

            for (let i = 0; i < nodes.length; i++) {
                let n1 = nodes[i]; n1.x += n1.vx; n1.y += n1.vy; n1.pulse += 0.05;
                if (n1.x < 0 || n1.x > w) n1.vx *= -1; if (n1.y < 0 || n1.y > h) n1.vy *= -1;

                for (let j = i + 1; j < nodes.length; j++) {
                    let n2 = nodes[j]; let d = Math.hypot(n2.x - n1.x, n2.y - n1.y);
                    if (d < 110) {
                        ctx.strokeStyle = `rgba(0, 240, 255, ${0.7 * (1 - d/110)})`; ctx.lineWidth = 0.6;
                        ctx.beginPath(); ctx.moveTo(n1.x, n1.y); ctx.lineTo(n2.x, n2.y); ctx.stroke();
                    }
                }
                ctx.fillStyle = `hsl(180, 100%, ${60 + Math.sin(n1.pulse) * 20}%)`;
                ctx.beginPath(); ctx.arc(n1.x, n1.y, 2 + Math.sin(n1.pulse)*0.5, 0, Math.PI * 2); ctx.fill();
            }
            requestAnimationFrame(draw);
        }
        draw();
    </script>
</body>
</html>
