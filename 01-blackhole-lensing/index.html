<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gravitational Lensing Simulation</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background: #000; }
        canvas { display: block; }
    </style>
</head>
<body>
    <canvas id="bhCanvas"></canvas>
    <script>
        const canvas = document.getElementById('bhCanvas');
        const ctx = canvas.getContext('2d');
        
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;
        
        let bh = { x: width / 2, y: height / 2, mass: 12000, rs: 45 };
        const stars = [];

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            bh.x = width / 2; bh.y = height / 2;
            initStars();
        });

        window.addEventListener('mousemove', (e) => {
            bh.x = e.clientX;
            bh.y = e.clientY;
        });

        function initStars() {
            stars.length = 0;
            for (let i = 0; i < 600; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    r: Math.random() * 1.5 + 0.5,
                    color: `hsl(${Math.random() * 40 + 200}, 80%, 90%)`
                });
            }
        }

        function draw() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
            ctx.fillRect(0, 0, width, height);

            stars.forEach(star => {
                let dx = star.x - bh.x;
                let dy = star.y - bh.y;
                let r2 = dx * dx + dy * dy;
                let r = Math.sqrt(r2);

                if (r < bh.rs) return;

                let deflection = (2 * bh.mass) / r2;
                let ox = star.x + dx * deflection;
                let oy = star.y + dy * deflection;

                ctx.fillStyle = star.color;
                ctx.beginPath();
                ctx.arc(ox, oy, star.r * (r / (r - bh.rs * 0.5)), 0, Math.PI * 2);
                ctx.fill();
            });

            ctx.fillStyle = '#000000';
            ctx.beginPath();
            ctx.arc(bh.x, bh.y, bh.rs, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.strokeStyle = 'rgba(255, 140, 0, 0.45)';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(bh.x, bh.y, bh.rs * 1.6, 0, Math.PI * 2);
            ctx.stroke();

            requestAnimationFrame(draw);
        }

        initStars();
        draw();
    </script>
</body>
</html>
