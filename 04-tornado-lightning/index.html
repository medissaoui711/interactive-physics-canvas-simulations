<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tornado & Electrostatic Lightning</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background: #030308; }
        canvas { display: block; }
    </style>
</head>
<body>
    <canvas id="tornadoCanvas"></canvas>
    <script>
        const canvas = document.getElementById('tornadoCanvas');
        const ctx = canvas.getContext('2d');
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        const particles = [];
        let centerX = width / 2;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            centerX = width / 2;
        });

        window.addEventListener('mousemove', (e) => { centerX = e.clientX; });

        class Particle {
            constructor() { this.reset(); this.y = Math.random() * height; }
            reset() {
                this.angle = Math.random() * Math.PI * 2;
                this.radius = Math.random() * 250 + 10;
                this.y = height + Math.random() * 20;
                this.speed = Math.random() * 0.04 + 0.02;
                this.rise = Math.random() * 2 + 1.5;
                this.size = Math.random() * 2 + 0.5;
                this.alpha = Math.random() * 0.6 + 0.2;
            }
            update() {
                this.angle += this.speed;
                this.radius -= 0.35;
                this.y -= this.rise;
                if (this.y < 0 || this.radius <= 0) this.reset();
            }
            draw() {
                let x = centerX + Math.cos(this.angle) * this.radius;
                ctx.fillStyle = `rgba(140, 170, 210, ${this.alpha * (this.radius/200)})`;
                ctx.beginPath(); ctx.arc(x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
            }
        }

        for (let i = 0; i < 900; i++) particles.push(new Particle());

        function generateLightning(sx, sy) {
            ctx.strokeStyle = 'rgba(180, 220, 255, 0.9)';
            ctx.lineWidth = Math.random() * 3 + 1;
            ctx.shadowBlur = 15; ctx.shadowColor = '#00f';
            ctx.beginPath(); ctx.moveTo(sx, sy);
            let tx = sx, ty = sy;
            while (ty < height) {
                tx += Math.random() * 40 - 20; ty += Math.random() * 30 + 10;
                ctx.lineTo(tx, ty);
            }
            ctx.stroke(); ctx.shadowBlur = 0;
        }

        function draw() {
            ctx.fillStyle = 'rgba(3, 3, 8, 0.15)'; ctx.fillRect(0, 0, width, height);
            particles.forEach(p => { p.update(); p.draw(); });
            if (Math.random() < 0.03) generateLightning(centerX + Math.random()*100-50, 0);
            requestAnimationFrame(draw);
        }
        draw();
    </script>
</body>
</html>
